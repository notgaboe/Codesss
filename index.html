<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photobooth Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Happy Anniversary, My Love!</h1>
        <div class="photobooth">
            <div class="photo-container">
                <div class="photo" id="photo1">
                    <img src="https://raw.githubusercontent.com/notgaboe/my-yuna/cacb8296b02a3bbea2c0dd4cc2597bbd4aa2ad38/images/cool.jpg" alt="Photo 1 Front" class="front">
                    <div class="back">You're my sunshine!</div>
                </div>
            </div>
            <div class="photo-container">
                <div class="photo" id="photo2">
                    <img src="https://raw.githubusercontent.com/notgaboe/my-yuna/cacb8296b02a3bbea2c0dd4cc2597bbd4aa2ad38/images/love.jpg" alt="Photo 2 Front" class="front">
                    <div class="back">I love your smile!</div>
                </div>
            </div>
            <div class="photo-container">
                <div class="photo" id="photo3">
                    <img src="https://raw.githubusercontent.com/notgaboe/my-yuna/cacb8296b02a3bbea2c0dd4cc2597bbd4aa2ad38/images/wow.jpg" alt="Photo 3 Front" class="front">
                    <div class="back">You make me so happy!</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
