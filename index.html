<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photobooth Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Happy (Occasion), My Love!</h1>
        <div class="photobooth">
            <div class="photo-container">
                <div class="photo" id="photo1">
                    <img src="image1.jpg" alt="Photo 1 Front" class="front">
                    <div class="back">You're my sunshine! ☀️</div>
                </div>
            </div>
            <div class="photo-container">
                <div class="photo" id="photo2">
                    <img src="image2.jpg" alt="Photo 2 Front" class="front">
                    <div class="back">I love your smile! 😊</div>
                </div>
            </div>
            <div class="photo-container">
                <div class="photo" id="photo3">
                    <img src="image3.jpg" alt="Photo 3 Front" class="front">
                    <div class="back">You make me so happy! 💕</div>
                </div>
            </div>
        </div>
        <p class="love-note">A little something to remind you how much I care. ❤️</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
